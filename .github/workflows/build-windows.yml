name: Build Windows EXE

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-exe:
    name: Build Hashem Agent for Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip install -r build/requirements-windows.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Build the executable
        run: python build/windows/build_exe.py

      - name: Smoke-test the executable
        run: |
          ./dist/HashemAgent.exe --version --out version.json
          Get-Content version.json
          ./dist/HashemAgent.exe doctor --json --out doctor.json
          if ($LASTEXITCODE -ne 0) { Write-Error "doctor reported problems"; exit 1 }
          Get-Content doctor.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashemAgent-Windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: dist/*.exe
          generate_release_notes: true
